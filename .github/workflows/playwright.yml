name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  # schedule:
  #  - cron: '0 2 * * *'  # Nightly run 2 AM UTC turned off to save free plan
jobs:
  smoke:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run smoke tests
      run: npx playwright test --grep @smoke --project=chromium
  
  test:
    needs: smoke
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Reset mock database
      run: cp db.seed.json db.json
    - name: Start mock API server
      run: npx json-server --watch db.json --port 3000 &
    - name: Wait for mock server to be ready
      run: npx wait-on http://localhost:3000/users --timeout 30000
    - name: Run Playwright tests (shard ${{ matrix.shard }}/3)
      run: npx playwright test --shard=${{ matrix.shard }}/3
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.shard }}
        path: playwright-report/
        retention-days: 30  
    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-${{ matrix.shard }}
        path: allure-report/
  merge-reports:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Download all Allure results
      uses: actions/download-artifact@v4
      with:
        pattern: allure-results-*
        path: allure-results
        merge-multiple: true
    - name: Generate merged Allure report
      run: |
        npm install -g allure-commandline
        npx allure generate allure-results --clean -o allure-report
    - name: Upload merged Allure report
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-merged
        path: allure-report/
        retention-days: 30